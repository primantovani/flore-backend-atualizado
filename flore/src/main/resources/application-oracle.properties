# Perfil "oracle": ativado com SPRING_PROFILES_ACTIVE=oracle (pipeline e producao).
# Conexao sempre por variavel de ambiente - nunca commitar senha aqui.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema e dos scripts em db/ (rodados pelo pipeline), nao do Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.h2.console.enabled=false
