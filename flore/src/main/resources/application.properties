spring.application.name=flore

# Render (e a maioria dos PaaS) define a porta via variavel de ambiente PORT;
# sem isso o Spring Boot sobe fixo na 8080 e o servico fica inacessivel.
server.port=${PORT:8080}

# Troque por um segredo forte (min 32 chars) e mova para variavel de ambiente antes de subir pra producao
flore.jwt.secret=troque-este-segredo-por-uma-chave-bem-grande-e-aleatoria-32chars
flore.jwt.expiration-ms=86400000

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
